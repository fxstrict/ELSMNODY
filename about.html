<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="محمد السمنودي — مؤسس إلسمنودي بيسبوك، حرفي خياطة رجالية فاخرة منذ أكثر من 20 عاماً في مصر والخليج.">
  <meta property="og:title"       content="محمد السمنودي | ELSMNODY BESPOKE">
  <meta property="og:description" content="حرفي يحوّل القماش إلى حضور، والخيط إلى هوية.">
  <meta property="og:image"       content="https://fxstrict.github.io/ELSMNODY/assets/images/founder/founder-portrait.webp">
  <meta property="og:type"        content="website">
  <title>محمد السمنودي | ELSMNODY BESPOKE</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/about.css">

  <style>
    html { scroll-padding-top: 80px; }

    /* Scroll reveal base */
    .reveal {
      opacity: 0; transform: translateY(28px);
      transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out);
    }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { transition: none; opacity: 1; transform: none; }
    }
  </style>
  <link rel="stylesheet" href="css/whatsapp.css">
</head>

<body>

  <!-- ===================== NAVBAR ===================== -->
  <header class="navbar" id="navbar">
    <div class="navbar__inner">
      <a href="index.html" aria-label="ELSMNODY BESPOKE — الرئيسية">
        <img
          src="assets/logo/logo.svg"
          alt="ELSMNODY BESPOKE"
          class="navbar__logo"
          onerror="this.outerHTML='<span style=\'font-family:var(--font-display);font-size:1rem;color:var(--color-gold);letter-spacing:4px\'>ELSMNODY</span>'"
        >
      </a>
      <div class="navbar__cta"></div>
      <button class="navbar__toggle" aria-label="فتح القائمة">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>
  <!-- Mobile menu injected by JS -->

  <!-- ===================== HERO ===================== -->
  <section id="about-hero" class="about-hero"></section>

  <!-- ===================== INTRO / STORY ===================== -->
  <section id="about-intro" class="about-intro section"></section>

  <!-- ===================== STATS ===================== -->
  <section id="about-stats" class="about-stats"></section>

  <!-- ===================== PHILOSOPHY ===================== -->
  <section id="about-philosophy" class="about-philosophy section"></section>

  <!-- ===================== TIMELINE ===================== -->
  <section id="about-timeline" class="about-timeline section"></section>

  <!-- ===================== ATELIER GALLERY ===================== -->
  <section id="about-atelier" class="about-atelier section"></section>

  <!-- ===================== TESTIMONIALS ===================== -->
  <section id="about-testimonials" class="about-testimonials section"></section>

  <!-- ===================== CTA ===================== -->
  <section id="about-cta" class="about-cta"></section>

  <!-- ===================== FOOTER ===================== -->
  <footer
    id="footer"
    style="background:var(--color-bg-deep);border-top:var(--divider-gold);padding:var(--space-10) 0 var(--space-6)"
  ></footer>

  

  <!-- ===================== LIGHTBOX ===================== -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="عرض الصورة">
    <button class="lightbox__close" onclick="closeLightbox()" aria-label="إغلاق">✕</button>
    <img class="lightbox__img" id="lightboxImg" src="" alt="ELSMNODY Atelier">
  </div>

  <!-- Script -->
  <script src="js/about.js"></script>

  <!-- Hero BG animation trigger -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => {
        const bg = document.querySelector('.about-hero__bg');
        if (bg) setTimeout(() => bg.classList.add('loaded'), 100);
      });
    });
  </script>

  <script src="js/seo.js"></script>
  <script src="js/whatsapp.js"></script>
</body>
</html>
