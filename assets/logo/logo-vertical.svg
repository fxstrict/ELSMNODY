<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="ELSMNODY BESPOKE Vertical">
  <defs>
    <linearGradient id="goldV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9E7A2A"/>
      <stop offset="50%"  stop-color="#E2C97E"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>

  <!-- Monogram mark centered -->
  <circle cx="100" cy="65" r="48" fill="none" stroke="url(#goldV)" stroke-width="0.8" opacity="0.5"/>
  <circle cx="100" cy="65" r="43" fill="none" stroke="url(#goldV)" stroke-width="0.3" opacity="0.25"/>
  <text x="100" y="82" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="400" text-anchor="middle" fill="url(#goldV)">EB</text>

  <!-- Horizontal rule -->
  <line x1="40" y1="128" x2="160" y2="128" stroke="#C9A84C" stroke-width="0.5" opacity="0.4"/>

  <!-- Brand name -->
  <text x="100" y="160" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="400" letter-spacing="5" text-anchor="middle" fill="url(#goldV)">ELSMNODY</text>

  <!-- Tagline -->
  <text x="100" y="185" font-family="'Inter', Helvetica, sans-serif" font-size="9" font-weight="300" letter-spacing="5" text-anchor="middle" fill="#C9A84C" opacity="0.7">BESPOKE</text>

  <!-- Sub-tagline -->
  <text x="100" y="205" font-family="'Inter', Helvetica, sans-serif" font-size="7" font-weight="300" letter-spacing="3" text-anchor="middle" fill="#C9A84C" opacity="0.45">CRAFTING PRESENCE</text>
</svg>
