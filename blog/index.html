    function getLang() { return document.documentElement.lang === 'en' ? 'en' : 'ar'; }

    function renderBlog() {
      const lang = getLang();
      const t = T[lang];
      const articles = ARTICLES[lang];

      document.getElementById('blog-eyebrow').textContent = t.eyebrow;
      document.getElementById('blog-title').textContent   = t.title;
      document.getElementById('blog-desc').textContent    = t.desc;

      const grid = document.getElementById('blog-grid');
      grid.innerHTML = articles.map(a => `
        <article class="blog-card" onclick="location.href='${a.slug}'">
          <img class="blog-card__img" src="${a.img}" alt="${a.title}" loading="lazy">
          <div class="blog-card__body">
            <span class="blog-card__tag">${a.tag}</span>
            <h2 class="blog-card__title">${a.title}</h2>
            <p class="blog-card__excerpt">${a.excerpt}</p>
            <a href="${a.slug}" class="blog-card__link">${t.readMore}</a>
          </div>
        </article>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderBlog);
    new MutationObserver(renderBlog).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
