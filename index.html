  <!-- Update contact section on lang change -->
  <script>
    const _origRenderAll = window.renderAll || (() => {});
    document.addEventListener('DOMContentLoaded', () => {
      // Observer for contact section language update
      const contactObserver = new MutationObserver(() => {
        const lang = document.documentElement.lang;
        const T = lang === 'ar'
          ? { ey: 'احجز موعدك', ti: 'ابدأ رحلة بدلتك الآن', de: 'تواصل معنا الآن لحجز استشارتك المجانية. سنساعدك في اختيار القماش المثالي وتصميم بدلة تعكس شخصيتك.', call: 'اتصل بنا' }
          : { ey: 'Book Appointment', ti: 'Begin Your Bespoke Journey', de: 'Contact us now to book your free consultation. We will guide you through fabric selection and design to craft a suit that truly reflects your identity.', call: 'Call Us' };
        const ey = document.getElementById('contact-eyebrow');
        const ti = document.getElementById('contact-title');
        const de = document.getElementById('contact-desc');
        const ca = document.getElementById('contact-call');
        if (ey) ey.textContent = T.ey;
        if (ti) ti.textContent = T.ti;
        if (de) de.textContent = T.de;
        if (ca) ca.textContent = T.call;
      });
      contactObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    });
  </script>
